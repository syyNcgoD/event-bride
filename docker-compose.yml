# ============================================
# EventBride - Full Stack Microservices
# Run: docker-compose up --build
# ============================================

name: eventbride

services:
  # ================= Infrastructure =================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eventbride-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "EventBride@2026"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'EventBride@2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: eventbride-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eventbride-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  seq:
    image: datalust/seq:latest
    container_name: eventbride-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  # ================= Microservices =================

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    container_name: eventbride-identity
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EventBride;User Id=sa;Password=EventBride@2026;TrustServerCertificate=True
      - Serilog__SeqUrl=http://seq:80
    ports:
      - "5001:80"
    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started

  events-api:
    build:
      context: .
      dockerfile: src/Services/Events/Events.API/Dockerfile
    container_name: eventbride-events
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EventBride;User Id=sa;Password=EventBride@2026;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - Serilog__SeqUrl=http://seq:80
    ports:
      - "5002:80"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      seq:
        condition: service_started

  booking-api:
    build:
      context: .
      dockerfile: src/Services/Booking/Booking.API/Dockerfile
    container_name: eventbride-booking
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EventBride;User Id=sa;Password=EventBride@2026;TrustServerCertificate=True
      - RabbitMQ__Host=rabbitmq
      - Services__EventsApi=http://events-api:80
      - Serilog__SeqUrl=http://seq:80
    ports:
      - "5003:80"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      events-api:
        condition: service_started
      seq:
        condition: service_started

  notification-api:
    build:
      context: .
      dockerfile: src/Services/Notification/Notification.API/Dockerfile
    container_name: eventbride-notification
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EventBride;User Id=sa;Password=EventBride@2026;TrustServerCertificate=True
      - RabbitMQ__Host=rabbitmq
      - Serilog__SeqUrl=http://seq:80
    ports:
      - "5004:80"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      seq:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: src/Gateway/ApiGateway/Dockerfile
    container_name: eventbride-gateway
    environment:
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-api:80/
      - ReverseProxy__Clusters__events-cluster__Destinations__destination1__Address=http://events-api:80/
      - ReverseProxy__Clusters__booking-cluster__Destinations__destination1__Address=http://booking-api:80/
    ports:
      - "5000:80"
    depends_on:
      identity-api:
        condition: service_started
      events-api:
        condition: service_started
      booking-api:
        condition: service_started

# ================= Volumes =================

volumes:
  sqlserver-data:
  redis-data:
  rabbitmq-data:
  seq-data: